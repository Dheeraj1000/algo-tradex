# =============================================
# AlgoTradeX Backend Configuration
# =============================================

spring:
  application:
    name: AlgoTradeX

  # Database
  datasource:
    url: jdbc:postgresql://:${POSTGRES_PORT:5432}/${POSTGRES_DB:algotradex}
    username: ${POSTGRES_USER:algotradex}
    password: ${POSTGRES_PASSWORD:change_me_in_production}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      pool-name: AlgoTradeX-HikariPool

  # JPA
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          time_zone: Asia/Kolkata
          batch_size: 25
        order_inserts: true
        order_updates: true
    open-in-view: false

  # Flyway
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  # Redis
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 5000ms
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 4

  # Mail
  mail:
    host: ${SMTP_HOST:smtp.gmail.com}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enabled: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

  # Jackson
  jackson:
    serialization:
      write-dates-as-timestamps: false
      indent-output: false
    deserialization:
      fail-on-unknown-properties: false
    default-property-inclusion: non_null
    date-format: yyyy-MM-dd'T'HH:mm:ss.SSS'Z'
    time-zone: Asia/Kolkata

  # Servlet
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

  # Task execution
  task:
    execution:
      pool:
        core-size: 8
        max-size: 32
        queue-capacity: 100
      thread-name-prefix: algotradex-async-
    scheduling:
      pool:
        size: 4
      thread-name-prefix: algotradex-sched-

# =============================================
# Application Properties
# =============================================
app:
  jwt:
    secret: ${JWT_SECRET:your-256-bit-secret-key-change-in-production-minimum-32-chars-long}
    expiration-ms: ${JWT_EXPIRATION_MS:900000}
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

  encryption:
    key: ${ENCRYPTION_KEY:32-byte-encryption-key-change-me!}
    algorithm: ${ENCRYPTION_ALGORITHM:AES/GCM/NoPadding}

  email:
    from: ${SMTP_FROM:noreply@algotradex.com}
    verification-url: ${EMAIL_VERIFICATION_URL:http://localhost:3000/verify-email}
    reset-password-url: ${RESET_PASSWORD_URL:http://localhost:3000/reset-password}

  telegram:
    bot-token: ${TELEGRAM_BOT_TOKEN:}

  ai-service:
    url: ${AI_SERVICE_URL:http://localhost:8000}

  trading:
    max-daily-loss-percent: 5.0
    max-position-size-percent: 10.0
    default-slippage-percent: 0.1
    market-open-time: "09:15"
    market-close-time: "15:30"
    pre-market-open: "09:00"
    timezone: Asia/Kolkata

# =============================================
# Actuator
# =============================================
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized
  info:
    env:
      enabled: true

# =============================================
# Logging
# =============================================
logging:
  level:
    root: INFO
    com.algotradex: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: WARN
    org.flywaydb: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/algotradex.log
    max-size: 50MB
    max-history: 30

# =============================================
# SpringDoc OpenAPI
# =============================================
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method
  info:
    title: AlgoTradeX API
    description: Production-ready algorithmic trading platform API
    version: 1.0.0

server:
  port: 8080
  servlet:
    context-path: /
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/xml,text/plain
    min-response-size: 1024
