version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: algotradex-db
    environment:
      POSTGRES_DB: algotradex
      POSTGRES_USER: algotradex
      POSTGRES_PASSWORD: algotradex123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U algotradex"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: algotradex-backend
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/algotradex
      SPRING_DATASOURCE_USERNAME: algotradex
      SPRING_DATASOURCE_PASSWORD: algotradex123
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: algotradex-ai
    environment:
      DB_HOST: postgres
    ports:
      - "8001:8000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  token-refresher:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: algotradex-refresher
    command: ["python", "token_refresher.py"]
    environment:
      DB_HOST: postgres
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  market-monitor:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: algotradex-monitor
    command: ["python", "market_monitor.py"]
    environment:
      DB_HOST: postgres
      API_URL: http://ai-service:8000/models/predict
    depends_on:
      postgres:
        condition: service_healthy
      ai-service:
        condition: service_started
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: algotradex-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
